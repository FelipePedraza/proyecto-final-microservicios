apiVersion: 1
prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_DATASOURCE_URL}
    isDefault: true
    editable: false
    version: 1

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${LOKI_DATASOURCE_URL}
    editable: false
    version: 1
    jsonData:
      timeout: 30
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId"\s*:\s*"([0-9a-fA-F]{32})"'
          url: '${ZIPKIN_EXTERNAL_URL}/$${__value.raw}'
          urlDisplayLabel: Ver traza en Zipkin
