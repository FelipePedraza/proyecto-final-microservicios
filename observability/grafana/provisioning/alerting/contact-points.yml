apiVersion: 1
contactPoints:
  - orgId: 1
    name: discord-equipo
    receivers:
      - uid: discord-webhook
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          use_discord_username: true
policies:
  - orgId: 1
    receiver: discord-equipo
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
