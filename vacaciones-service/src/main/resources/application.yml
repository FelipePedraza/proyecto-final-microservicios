server:
  port: ${PORT:8085}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: vacaciones-service
      customizer: observability.TraceLoggingCustomizer
spring:
  main.banner-mode: off
  application.name: vacaciones-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vacaciones}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  endpoint.prometheus.enabled: true
  metrics.tags.application: ${spring.application.name}
otel:
  service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  traces.exporter: ${OTEL_TRACES_EXPORTER:zipkin}
  traces.sampler: ${OTEL_TRACES_SAMPLER:always_on}
  exporter.zipkin.endpoint: ${OTEL_EXPORTER_ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
  propagators: ${OTEL_PROPAGATORS:tracecontext,baggage}
  metrics.exporter: ${OTEL_METRICS_EXPORTER:none}
  logs.exporter: ${OTEL_LOGS_EXPORTER:none}
vacaciones:
  scheduler:
    cron: ${VACACIONES_CRON:0 * * * * *}
    manual-enabled: ${VACACIONES_MANUAL_ENABLED:false}
