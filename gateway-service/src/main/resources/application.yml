server:
  port: ${GATEWAY_SERVER_PORT:8088}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          routes:
            - id: auth-openapi
              uri: ${AUTH_SERVICE_URL:http://auth-service:8089}
              predicates:
                - Path=/openapi/auth
              filters:
                - RewritePath=/openapi/auth, /v3/api-docs
            - id: empleado-openapi
              uri: ${EMPLEADOS_SERVICE_URL:http://empleado-service:8080}
              predicates:
                - Path=/openapi/registro
              filters:
                - RewritePath=/openapi/registro, /swagger/v1/swagger.json
            - id: departamentos-openapi
              uri: ${DEPARTAMENTO_SERVICE_URL:http://departamento-service:8081}
              predicates:
                - Path=/openapi/departamentos
              filters:
                - RewritePath=/openapi/departamentos, /openapi.json
            - id: perfiles-openapi
              uri: ${PERFILES_SERVICE_URL:http://perfiles-service:8083}
              predicates:
                - Path=/openapi/perfiles
              filters:
                - RewritePath=/openapi/perfiles, /swagger/doc.json
            - id: notificaciones-openapi
              uri: ${NOTIFICACIONES_SERVICE_URL:http://notificaciones-service:8082}
              predicates:
                - Path=/openapi/notificaciones
              filters:
                - RewritePath=/openapi/notificaciones, /openapi.json
            - id: vacaciones-openapi
              uri: ${VACACIONES_SERVICE_URL:http://vacaciones-service:8085}
              predicates:
                - Path=/openapi/vacaciones
              filters:
                - RewritePath=/openapi/vacaciones, /v3/api-docs
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8089}
              predicates:
                - Path=/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authServiceCircuitBreaker
                    fallbackUri: forward:/fallback/auth-service
            - id: empleados-service
              uri: ${EMPLEADOS_SERVICE_URL:http://empleado-service:8080}
              predicates:
                - Path=/empleados/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: empleadosServiceCircuitBreaker
                    fallbackUri: forward:/fallback/empleados-service
            - id: departamento-service
              uri: ${DEPARTAMENTO_SERVICE_URL:http://departamento-service:8081}
              predicates:
                - Path=/departamentos/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: departamentoServiceCircuitBreaker
                    fallbackUri: forward:/fallback/departamento-service
            - id: perfiles-service
              uri: ${PERFILES_SERVICE_URL:http://perfiles-service:8083}
              predicates:
                - Path=/perfiles/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: perfilesServiceCircuitBreaker
                    fallbackUri: forward:/fallback/perfiles-service
            - id: notificaciones-service
              uri: ${NOTIFICACIONES_SERVICE_URL:http://notificaciones-service:8082}
              predicates:
                - Path=/notificaciones/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notificacionesServiceCircuitBreaker
                    fallbackUri: forward:/fallback/notificaciones-service
            - id: vacaciones-service
              uri: ${VACACIONES_SERVICE_URL:http://vacaciones-service:8085}
              predicates:
                - Path=/vacaciones/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: vacacionesServiceCircuitBreaker
                    fallbackUri: forward:/fallback/vacaciones-service

jwt:
  secret: ${JWT_SECRET}

gateway:
  security:
    public-paths:
      - /health
      - /actuator/health/**
      - /fallback/**
      - /auth/login
      - /auth/recover-password
      - /auth/reset-password
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /v3/api-docs.yaml
      - /openapi/**
      - /webjars/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: Autenticación
        url: /openapi/auth
      - name: Empleados
        url: /openapi/registro
      - name: Departamentos
        url: /openapi/departamentos
      - name: Perfiles
        url: /openapi/perfiles
      - name: Notificaciones
        url: /openapi/notificaciones
      - name: Vacaciones
        url: /openapi/vacaciones
    urls-primary-name: Autenticación

resilience4j:
  circuitbreaker:
    instances:
      authServiceCircuitBreaker: &cb
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      empleadosServiceCircuitBreaker: *cb
      departamentoServiceCircuitBreaker: *cb
      perfilesServiceCircuitBreaker: *cb
      notificacionesServiceCircuitBreaker: *cb
      vacacionesServiceCircuitBreaker: *cb
  timelimiter:                       # FALTABA: el default de Spring Cloud CircuitBreaker es 1 s
    instances:
      authServiceCircuitBreaker:
        timeoutDuration: 6s
      empleadosServiceCircuitBreaker:
        timeoutDuration: 6s
      departamentoServiceCircuitBreaker:
        timeoutDuration: 6s
      perfilesServiceCircuitBreaker:
        timeoutDuration: 6s
      notificacionesServiceCircuitBreaker:
        timeoutDuration: 6s
      vacacionesServiceCircuitBreaker:
        timeoutDuration: 6s
