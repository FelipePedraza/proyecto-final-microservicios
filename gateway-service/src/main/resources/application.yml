server:
  port: ${GATEWAY_SERVER_PORT:8088}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          routes:
            - id: empleados-service
              uri: ${EMPLEADOS_SERVICE_URL:http://registro-service:8080}
              predicates:
                - Path=/empleados/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: empleadosServiceCircuitBreaker
                    fallbackUri: forward:/fallback/empleados-service
            - id: departamentos-service
              uri: ${DEPARTAMENTOS_SERVICE_URL:http://departamentos-service:8081}
              predicates:
                - Path=/departamentos/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: departamentosServiceCircuitBreaker
                    fallbackUri: forward:/fallback/departamentos-service
            - id: perfiles-service
              uri: ${PERFILES_SERVICE_URL:http://perfiles-service:8083}
              predicates:
                - Path=/perfiles/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: perfilesServiceCircuitBreaker
                    fallbackUri: forward:/fallback/perfiles-service
            - id: notificaciones-service
              uri: ${NOTIFICACIONES_SERVICE_URL:http://notificaciones-service:8082}
              predicates:
                - Path=/notificaciones/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notificacionesServiceCircuitBreaker
                    fallbackUri: forward:/fallback/notificaciones-service
            - id: vacaciones-service
              uri: ${VACACIONES_SERVICE_URL:http://vacaciones-service:8085}
              predicates:
                - Path=/vacaciones/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: vacacionesServiceCircuitBreaker
                    fallbackUri: forward:/fallback/vacaciones-service

resilience4j:
  circuitbreaker:
    instances:
      empleadosServiceCircuitBreaker: &cb
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      departamentosServiceCircuitBreaker: *cb
      perfilesServiceCircuitBreaker: *cb
      notificacionesServiceCircuitBreaker: *cb
      vacacionesServiceCircuitBreaker: *cb
  timelimiter:                       # FALTABA: el default de Spring Cloud CircuitBreaker es 1 s
    instances:
      empleadosServiceCircuitBreaker:
        timeoutDuration: 6s
      departamentosServiceCircuitBreaker:
        timeoutDuration: 6s
      perfilesServiceCircuitBreaker:
        timeoutDuration: 6s
      notificacionesServiceCircuitBreaker:
        timeoutDuration: 6s
      vacacionesServiceCircuitBreaker:
        timeoutDuration: 6s
