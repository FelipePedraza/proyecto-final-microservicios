name: reto-2-microservicios

services:
  registro-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${REGISTRO_DB_NAME:-registro_db}
      POSTGRES_USER: ${REGISTRO_DB_USER:-registro_user}
      POSTGRES_PASSWORD: ${REGISTRO_DB_PASSWORD:-registro_password}
    volumes:
      - registro-data:/var/lib/postgresql/data
      - ./database/registro:/docker-entrypoint-initdb.d:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamentos-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DEPARTAMENTOS_DB_NAME:-departamentos_db}
      POSTGRES_USER: ${DEPARTAMENTOS_DB_USER:-departamentos_user}
      POSTGRES_PASSWORD: ${DEPARTAMENTOS_DB_PASSWORD:-departamentos_password}
    volumes:
      - departamentos-data:/var/lib/postgresql/data
      - ./departamentos-serviceReto2/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamentos-service:
    build:
      context: ./departamentos-serviceReto2
    environment:
      DB_DEPARTAMENTOS_HOST: departamentos-db
      DB_DEPARTAMENTOS_PORT: 5432
      DB_DEPARTAMENTOS_NAME: ${DEPARTAMENTOS_DB_NAME:-departamentos_db}
      DB_DEPARTAMENTOS_USER: ${DEPARTAMENTOS_DB_USER:-departamentos_user}
      DB_DEPARTAMENTOS_PASSWORD: ${DEPARTAMENTOS_DB_PASSWORD:-departamentos_password}
    ports:
      - "${DEPARTAMENTOS_SERVICE_PORT:-8081}:8081"
    networks:
      - microservicios-network
    depends_on:
      departamentos-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  registro-service:
    build:
      context: ./Reto-1/RegistroService
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Registro: Host=registro-db;Port=5432;Database=${REGISTRO_DB_NAME:-registro_db};Username=${REGISTRO_DB_USER:-registro_user};Password=${REGISTRO_DB_PASSWORD:-registro_password}
      Departamentos__BaseUrl: http://departamentos-service:8081/
    ports:
      - "${REGISTRO_SERVICE_PORT:-8080}:8080"
    networks:
      - microservicios-network
    depends_on:
      registro-db:
        condition: service_healthy
      departamentos-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  microservicios-network:
    driver: bridge

volumes:
  registro-data:
  departamentos-data:
