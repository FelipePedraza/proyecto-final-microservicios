jenkins:
  systemMessage: "Jenkins del proyecto de microservicios: configurado como código."
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

jobs:
  - script: |
      pipelineJob('auth-service') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/FelipePedraza/proyecto-final-microservicios.git')
                }
                branch('*/main')
              }
            }
            scriptPath('auth-service/Jenkinsfile')
          }
        }
      }

      pipelineJob('test-docker-pipeline') {
        definition {
          cps {
            script('''pipeline {
              agent any
              stages {
                stage('Docker smoke') {
                  steps {
                    sh 'docker --version'
                    sh 'docker ps'
                  }
                }
              }
            }''')
            sandbox()
          }
        }
      }
