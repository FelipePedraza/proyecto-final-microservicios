jenkins:
  systemMessage: "Jenkins del proyecto de microservicios: configurado como código."
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USERNAME}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "DOTENV_FILE"
            value: "/run/secrets/microservicios.env"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: "sonarqube-token"
              scope: GLOBAL
              secret: "${SONAR_TOKEN}"
              description: "Token de análisis de SonarQube para los pipelines"

unclassified:
  location:
    url: "${JENKINS_ROOT_URL}"
  sonarglobalconfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "${JENKINS_SONARQUBE_URL}"
        credentialsId: "sonarqube-token"
        triggers:
          skipScmCause: false
          skipUpstreamCause: false

jobs:
  - script: |
      pipelineJob('auth-service') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GITHUB_REPOSITORY_URL}')
                }
                branch('*/main')
              }
            }
            scriptPath('auth-service/Jenkinsfile')
          }
        }
      }

      pipelineJob('empleado-service') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GITHUB_REPOSITORY_URL}')
                }
                branch('*/main')
              }
            }
            scriptPath('empleado-service/Jenkinsfile')
          }
        }
      }

      pipelineJob('test-docker-pipeline') {
        definition {
          cps {
            script('''pipeline {
              agent any
              stages {
                stage('Docker smoke') {
                  steps {
                    sh 'docker --version'
                    sh 'docker ps'
                  }
                }
              }
            }''')
            sandbox()
          }
        }
      }
