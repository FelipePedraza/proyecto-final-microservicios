name: microservicios

# Configuración compartida por los siete SDK de OpenTelemetry. El service.name
# se declara por servicio para que Zipkin muestre correctamente cada salto.
x-otel-environment: &otel-environment
  OTEL_TRACES_EXPORTER: zipkin
  OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_TRACES_SAMPLER: always_on
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  empleado-db:
    build:
      context: ./database/empleado
    environment:
      POSTGRES_DB: ${EMPLEADO_DB_NAME:?Define EMPLEADO_DB_NAME in .env}
      POSTGRES_USER: ${EMPLEADO_DB_USER:?Define EMPLEADO_DB_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_empleado_password
    secrets:
      - db_empleado_password
    volumes:
      - empleado-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamento-db:
    build:
      context: ./database/departamento
    environment:
      POSTGRES_DB: ${DEPARTAMENTO_DB_NAME:?Define DEPARTAMENTO_DB_NAME in .env}
      POSTGRES_USER: ${DEPARTAMENTO_DB_USER:?Define DEPARTAMENTO_DB_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_departamento_password
    secrets:
      - db_departamento_password
    volumes:
      - departamento-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamento-service:
    build:
      context: ./departamento-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: departamento-service
      PORT: ${DEPARTAMENTO_SERVICE_PORT:?Define DEPARTAMENTO_SERVICE_PORT in .env}
      DB_DEPARTAMENTO_HOST: ${DEPARTAMENTO_DB_HOST:?Define DEPARTAMENTO_DB_HOST in .env}
      DB_DEPARTAMENTO_PORT: ${DEPARTAMENTO_DB_PORT:?Define DEPARTAMENTO_DB_PORT in .env}
      DB_DEPARTAMENTO_NAME: ${DEPARTAMENTO_DB_NAME:?Define DEPARTAMENTO_DB_NAME in .env}
      DB_DEPARTAMENTO_USER: ${DEPARTAMENTO_DB_USER:?Define DEPARTAMENTO_DB_USER in .env}
    secrets:
      - db_departamento_password
    expose:
      - "${DEPARTAMENTO_SERVICE_PORT:?Define DEPARTAMENTO_SERVICE_PORT in .env}"
    networks:
      - microservicios-network
    depends_on:
      departamento-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${DEPARTAMENTO_SERVICE_PORT}/health/ready', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  empleado-service:
    build:
      context: ./empleado-service
    image: empleado-service:${EMPLEADO_SERVICE_IMAGE_TAG:-latest}
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: empleado-service
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Define ASPNETCORE_ENVIRONMENT in .env}
      ASPNETCORE_URLS: http://+:${EMPLEADO_SERVICE_PORT:?Define EMPLEADO_SERVICE_PORT in .env}
      DB_HOST: ${EMPLEADO_DB_HOST:?Define EMPLEADO_DB_HOST in .env}
      DB_PORT: ${EMPLEADO_DB_PORT:?Define EMPLEADO_DB_PORT in .env}
      DB_NAME: ${EMPLEADO_DB_NAME:?Define EMPLEADO_DB_NAME in .env}
      DB_USER: ${EMPLEADO_DB_USER:?Define EMPLEADO_DB_USER in .env}
      Departamentos__BaseUrl: ${DEPARTAMENTO_SERVICE_URL:?Define DEPARTAMENTO_SERVICE_URL in .env}
      # Circuits breaker hacia Departamentos (reto: 3-5 fallos consecutivos, circuito abierto 30-60 s)
      Departamentos__Resilience__FallosConsecutivos: ${CB_FALLOS_CONSECUTIVOS:?Define CB_FALLOS_CONSECUTIVOS in .env}
      Departamentos__Resilience__TimeoutLlamada: ${CB_TIMEOUT_LLAMADA:?Define CB_TIMEOUT_LLAMADA in .env}
      Departamentos__Resilience__DuracionCircuitoAbierto: ${CB_DURACION_CIRCUITO_ABIERTO:?Define CB_DURACION_CIRCUITO_ABIERTO in .env}
      # RabbitMQ (Reto 4): sin esto, RabbitMqPublisher usa su default "localhost", que
      # dentro del contenedor de empleado-service apunta a si mismo, no al broker. Con
      # eso empleado.creado nunca sale y ningun consumidor (notificaciones-service) lo
      # recibe. Debe coincidir con las credenciales configuradas en message-broker abajo.
      RabbitMQ__Host: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RabbitMQ__Port: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RabbitMQ__Username: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
    secrets:
      - db_empleado_password
      - broker_password
    expose:
      - "${EMPLEADO_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      empleado-db:
        condition: service_healthy
      departamento-service:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:${EMPLEADO_SERVICE_PORT}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  gateway-service:
    build:
      context: ./gateway-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: gateway-service
      GATEWAY_SERVICE_PORT: ${GATEWAY_SERVICE_PORT:?Define GATEWAY_SERVICE_PORT in .env}
      GATEWAY_CONNECT_TIMEOUT_MS: ${GATEWAY_CONNECT_TIMEOUT_MS:?Define GATEWAY_CONNECT_TIMEOUT_MS in .env}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:?Define GATEWAY_RESPONSE_TIMEOUT in .env}
      EMPLEADOS_SERVICE_URL: ${EMPLEADOS_SERVICE_URL:?Define EMPLEADOS_SERVICE_URL in .env}
      DEPARTAMENTO_SERVICE_URL: ${DEPARTAMENTO_SERVICE_URL:?Define DEPARTAMENTO_SERVICE_URL in .env}
      PERFILES_SERVICE_URL: ${PERFILES_SERVICE_URL:?Define PERFILES_SERVICE_URL in .env}
      NOTIFICACIONES_SERVICE_URL: ${NOTIFICACIONES_SERVICE_URL:?Define NOTIFICACIONES_SERVICE_URL in .env}
      VACACIONES_SERVICE_URL: ${VACACIONES_SERVICE_URL:?Define VACACIONES_SERVICE_URL in .env}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:?Define AUTH_SERVICE_URL in .env}
    secrets:
      - jwt_secret
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${GATEWAY_SERVICE_PORT:?Define GATEWAY_SERVICE_PORT in .env}:${GATEWAY_SERVICE_PORT}"
    expose:
      - "${GATEWAY_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      empleado-service:
        condition: service_healthy
      departamento-service:
        condition: service_healthy
      perfiles-service:
        condition: service_healthy
      notificaciones-service:
        condition: service_healthy
      vacaciones-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:${GATEWAY_SERVICE_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  message-broker:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${RABBITMQ_AMQP_PORT:?Define RABBITMQ_AMQP_PORT in .env}:5672"
      - "${HOST_BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:?Define RABBITMQ_MANAGEMENT_PORT in .env}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/broker_password)"
        export RABBITMQ_ERLANG_COOKIE="$$(cat /run/secrets/rabbitmq_erlang_cookie)"
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - broker_password
      - rabbitmq_erlang_cookie
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_listener", "5672"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  notificaciones-db:
    build:
      context: ./database/notificaciones
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_DB_NAME:?Define NOTIFICACIONES_DB_NAME in .env}
      POSTGRES_USER: ${NOTIFICACIONES_DB_USER:?Define NOTIFICACIONES_DB_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_notificaciones_password
    secrets:
      - db_notificaciones_password
    volumes:
      - notificaciones-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  notificaciones-service:
    build:
      context: ./notificaciones-service
    environment:
      OTEL_NODE_DISABLED_INSTRUMENTATIONS: amqplib
      <<: *otel-environment
      OTEL_SERVICE_NAME: notificaciones-service
      PORT: ${NOTIFICACIONES_SERVICE_PORT:?Define NOTIFICACIONES_SERVICE_PORT in .env}
      DB_HOST: ${NOTIFICACIONES_DB_HOST:?Define NOTIFICACIONES_DB_HOST in .env}
      DB_PORT: ${NOTIFICACIONES_DB_PORT:?Define NOTIFICACIONES_DB_PORT in .env}
      DB_NAME: ${NOTIFICACIONES_DB_NAME:?Define NOTIFICACIONES_DB_NAME in .env}
      DB_USER: ${NOTIFICACIONES_DB_USER:?Define NOTIFICACIONES_DB_USER in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?Define RABBITMQ_EXCHANGE in .env}
      RABBITMQ_QUEUE: ${NOTIFICACIONES_RABBITMQ_QUEUE:?Define NOTIFICACIONES_RABBITMQ_QUEUE in .env}
      RABBITMQ_DLQ: ${NOTIFICACIONES_RABBITMQ_DLQ:?Define NOTIFICACIONES_RABBITMQ_DLQ in .env}
      RABBITMQ_AUTH_EXCHANGE: ${RABBITMQ_AUTH_EXCHANGE:?Define RABBITMQ_AUTH_EXCHANGE in .env}
      RABBITMQ_AUTH_QUEUE: ${NOTIFICACIONES_RABBITMQ_AUTH_QUEUE:?Define NOTIFICACIONES_RABBITMQ_AUTH_QUEUE in .env}
      RABBITMQ_AUTH_DLQ: ${NOTIFICACIONES_RABBITMQ_AUTH_DLQ:?Define NOTIFICACIONES_RABBITMQ_AUTH_DLQ in .env}
      RABBITMQ_RECONEXION_MS: ${RABBITMQ_RECONEXION_MS:?Define RABBITMQ_RECONEXION_MS in .env}
    secrets:
      - db_notificaciones_password
      - broker_password
    expose:
      - "${NOTIFICACIONES_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      notificaciones-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${NOTIFICACIONES_SERVICE_PORT}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  perfiles-db:
    build:
      context: ./database/perfiles
    environment:
      POSTGRES_DB: ${PERFILES_DB_NAME:?Define PERFILES_DB_NAME in .env}
      POSTGRES_USER: ${PERFILES_DB_USER:?Define PERFILES_DB_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_perfiles_password
    secrets:
      - db_perfiles_password
    volumes:
      - perfiles-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  perfiles-service:
    build:
      context: ./perfiles-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: perfiles-service
      PORT: ${PERFILES_SERVICE_PORT:?Define PERFILES_SERVICE_PORT in .env}
      DB_HOST: ${PERFILES_DB_HOST:?Define PERFILES_DB_HOST in .env}
      DB_PORT: ${PERFILES_DB_PORT:?Define PERFILES_DB_PORT in .env}
      DB_NAME: ${PERFILES_DB_NAME:?Define PERFILES_DB_NAME in .env}
      DB_USER: ${PERFILES_DB_USER:?Define PERFILES_DB_USER in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?Define RABBITMQ_EXCHANGE in .env}
      RABBITMQ_QUEUE: ${PERFILES_RABBITMQ_QUEUE:?Define PERFILES_RABBITMQ_QUEUE in .env}
    secrets:
      - db_perfiles_password
      - broker_password
    expose:
      - "${PERFILES_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      perfiles-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${PERFILES_SERVICE_PORT}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  vacaciones-db:
    build:
      context: ./database/vacaciones
    environment:
      POSTGRES_DB: ${VACACIONES_DB_NAME:?Define VACACIONES_DB_NAME in .env}
      POSTGRES_USER: ${VACACIONES_DB_USER:?Define VACACIONES_DB_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_vacaciones_password
    secrets:
      - db_vacaciones_password
    volumes:
      - vacaciones-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  vacaciones-service:
    build:
      context: ./vacaciones-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: vacaciones-service
      PORT: ${VACACIONES_SERVICE_PORT:?Define VACACIONES_SERVICE_PORT in .env}
      DB_HOST: ${VACACIONES_DB_HOST:?Define VACACIONES_DB_HOST in .env}
      DB_PORT: ${VACACIONES_DB_PORT:?Define VACACIONES_DB_PORT in .env}
      DB_NAME: ${VACACIONES_DB_NAME:?Define VACACIONES_DB_NAME in .env}
      DB_USER: ${VACACIONES_DB_USER:?Define VACACIONES_DB_USER in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?Define RABBITMQ_EXCHANGE in .env}
      RABBITMQ_QUEUE: ${VACACIONES_RABBITMQ_QUEUE:?Define VACACIONES_RABBITMQ_QUEUE in .env}
      VACACIONES_CRON: ${VACACIONES_CRON:-0 * * * * *}
      VACACIONES_MANUAL_ENABLED: ${VACACIONES_MANUAL_ENABLED:-false}
    secrets:
      - db_vacaciones_password
      - broker_password
    expose:
      - "${VACACIONES_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      vacaciones-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${VACACIONES_SERVICE_PORT}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped


  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:?Define AUTH_DB_NAME in .env}
      POSTGRES_USER: ${AUTH_DB_USER:?Define AUTH_DB_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_auth_password
    secrets:
      - db_auth_password
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: auth-service:${AUTH_SERVICE_IMAGE_TAG:-latest}
    container_name: auth-service
    expose:
      - "${AUTH_SERVICE_PORT:?Define AUTH_SERVICE_PORT in .env}"
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: auth-service
      SERVER_PORT: ${AUTH_SERVICE_PORT}
      DB_HOST: ${AUTH_DB_HOST:?Define AUTH_DB_HOST in .env}
      DB_PORT: ${AUTH_DB_PORT:?Define AUTH_DB_PORT in .env}
      DB_NAME: ${AUTH_DB_NAME:?Define AUTH_DB_NAME in .env}
      DB_USER: ${AUTH_DB_USER:?Define AUTH_DB_USER in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL in .env}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_APPROLE_DIR: /vault/approle
      VAULT_STARTUP_TIMEOUT_SECONDS: ${VAULT_STARTUP_TIMEOUT_SECONDS:-60}
    secrets:
      - db_auth_password
      - broker_password
      - jwt_secret
      - auth_admin_password
    volumes:
      - vault-approle:/vault/approle:ro
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${AUTH_SERVICE_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  vault:
    image: hashicorp/vault:2.2.2
    profiles:
      - vault
    container_name: vault
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    entrypoint: ["/bin/sh"]
    command: ["/vault/config/server-dev.sh"]
    secrets:
      - vault_root_token
    volumes:
      - ./vault/server-dev.sh:/vault/config/server-dev.sh:ro,z
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${VAULT_HOST_PORT:-8200}:8200"
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  vault-bootstrap:
    image: hashicorp/vault:2.2.2
    profiles:
      - vault
    container_name: vault-bootstrap
    user: "0:0"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_APPROLE_DIR: /vault/approle
    entrypoint: ["/bin/sh"]
    command: ["/vault/config/bootstrap.sh"]
    secrets:
      - vault_root_token
      - db_auth_password
      - broker_password
      - jwt_secret
      - auth_admin_password
    volumes:
      - ./vault/bootstrap.sh:/vault/config/bootstrap.sh:ro,z
      - ./vault/policies:/vault/policies:ro,z
      - vault-approle:/vault/approle
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - microservicios-network
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PROMETHEUS_HOST_PORT:?Define PROMETHEUS_HOST_PORT in .env}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus
    networks:
      - microservicios-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${GRAFANA_HOST_PORT:?Define GRAFANA_HOST_PORT in .env}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Define GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      PROMETHEUS_DATASOURCE_URL: ${PROMETHEUS_DATASOURCE_URL:?Define PROMETHEUS_DATASOURCE_URL in .env}
      LOKI_DATASOURCE_URL: ${LOKI_DATASOURCE_URL:?Define LOKI_DATASOURCE_URL in .env}
      ZIPKIN_EXTERNAL_URL: ${ZIPKIN_EXTERNAL_URL:?Define ZIPKIN_EXTERNAL_URL in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export DISCORD_WEBHOOK_URL="$$(cat /run/secrets/discord_webhook_url)"
        exec /run.sh
    secrets:
      - grafana_admin_password
      - discord_webhook_url
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - microservicios-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${LOKI_HOST_PORT:?Define LOKI_HOST_PORT in .env}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro,z
      - loki-data:/loki
    networks:
      - microservicios-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?Define LOKI_PUSH_URL in .env}
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro,z
      - promtail-positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_started
    networks:
      - microservicios-network
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${ZIPKIN_HOST_PORT:?Define ZIPKIN_HOST_PORT in .env}:9411"
    networks:
      - microservicios-network
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    shm_size: 256m
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:?Define SONAR_DB_NAME en .env}
      POSTGRES_USER: ${SONAR_DB_USER:?Define SONAR_DB_USER en .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/sonar_db_password
    secrets:
      - sonar_db_password
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  sonarqube:
    image: sonarqube:25.2.0.102705-community
    container_name: sonarqube
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${SONARQUBE_HOST_PORT:?Define SONARQUBE_HOST_PORT in .env}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://${SONAR_DB_HOST:?Define SONAR_DB_HOST in .env}:${SONAR_DB_PORT:?Define SONAR_DB_PORT in .env}/${SONAR_DB_NAME:?Define SONAR_DB_NAME en .env}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:?Define SONAR_DB_USER en .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export SONAR_JDBC_PASSWORD="$$(cat /run/secrets/sonar_db_password)"
        exec /opt/sonarqube/docker/entrypoint.sh
    secrets:
      - sonar_db_password
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  dotnet-sonar-agent:
    image: dotnet-sonar:10.0-sonarscanner-12.0.0
    build:
      context: ./jenkins
      dockerfile: Dockerfile.dotnet-sonar
    profiles:
      - build-tools

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    # En Docker Desktop el socket suele usar el grupo 0; en Linux, define DOCKER_GID
    # con el gid real del socket (stat -c '%g' /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID:?Define DOCKER_GID in .env}"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${JENKINS_HOST_PORT:?Define JENKINS_HOST_PORT in .env}:8080"
      - "${HOST_BIND_IP:-127.0.0.1}:${JENKINS_AGENT_PORT:?Define JENKINS_AGENT_PORT in .env}:50000" # Puerto para agentes de Jenkins
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_ROOT_URL: ${JENKINS_ROOT_URL:?define JENKINS_ROOT_URL en .env}
      JENKINS_SONARQUBE_URL: ${JENKINS_SONARQUBE_URL:?define JENKINS_SONARQUBE_URL en .env}
      GITHUB_REPOSITORY_URL: ${GITHUB_REPOSITORY_URL:?define GITHUB_REPOSITORY_URL en .env}
      JENKINS_ADMIN_USERNAME: ${JENKINS_ADMIN_USERNAME:?define JENKINS_ADMIN_USERNAME en .env}
      SONAR_TOKEN_USER: ${SONAR_TOKEN_USER:?Define SONAR_TOKEN_USER en .env}
      SECRETS_DIR: /run/secrets
    secrets:
      - db_empleado_password
      - db_departamento_password
      - db_notificaciones_password
      - db_perfiles_password
      - db_vacaciones_password
      - db_auth_password
      - broker_password
      - rabbitmq_erlang_cookie
      - jwt_secret
      - auth_admin_password
      - jenkins_admin_password
      - sonar_token
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock:rw # Acceso al Docker daemon del host
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro,z
      - ./.env:/run/config/microservicios.env:ro,z
    networks:
      - microservicios-network
    restart: unless-stopped

networks:
  microservicios-network:
    name: microservicios-network
    driver: bridge

volumes:
  rabbitmq-data:
  empleado-data:
  departamento-data:
  notificaciones-data:
  perfiles-data:
  vacaciones-data:
  auth_db_data:
  jenkins_data:
  sonar_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
  vault-approle:

secrets:
  db_empleado_password:
    file: ${SECRETS_DIR:-./secrets}/db_empleado_password.txt
  db_departamento_password:
    file: ${SECRETS_DIR:-./secrets}/db_departamento_password.txt
  db_notificaciones_password:
    file: ${SECRETS_DIR:-./secrets}/db_notificaciones_password.txt
  db_perfiles_password:
    file: ${SECRETS_DIR:-./secrets}/db_perfiles_password.txt
  db_vacaciones_password:
    file: ${SECRETS_DIR:-./secrets}/db_vacaciones_password.txt
  db_auth_password:
    file: ${SECRETS_DIR:-./secrets}/db_auth_password.txt
  broker_password:
    file: ${SECRETS_DIR:-./secrets}/broker_password.txt
  rabbitmq_erlang_cookie:
    file: ${SECRETS_DIR:-./secrets}/rabbitmq_erlang_cookie.txt
  jwt_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_secret.txt
  auth_admin_password:
    file: ${SECRETS_DIR:-./secrets}/auth_admin_password.txt
  jenkins_admin_password:
    file: ${SECRETS_DIR:-./secrets}/jenkins_admin_password.txt
  sonar_db_password:
    file: ${SECRETS_DIR:-./secrets}/sonar_db_password.txt
  sonar_token:
    file: ${SECRETS_DIR:-./secrets}/sonar_token.txt
  grafana_admin_password:
    file: ${SECRETS_DIR:-./secrets}/grafana_admin_password.txt
  discord_webhook_url:
    file: ${SECRETS_DIR:-./secrets}/discord_webhook_url.txt
  vault_root_token:
    file: ${SECRETS_DIR:-./secrets}/vault_root_token.txt
