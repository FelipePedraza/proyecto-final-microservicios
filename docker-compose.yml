name: microservicios

services:
  empleado-db:
    build:
      context: ./database/empleado
    environment:
      POSTGRES_DB: ${EMPLEADO_DB_NAME:?Define EMPLEADO_DB_NAME in .env}
      POSTGRES_USER: ${EMPLEADO_DB_USER:?Define EMPLEADO_DB_USER in .env}
      POSTGRES_PASSWORD: ${EMPLEADO_DB_PASSWORD:?Define EMPLEADO_DB_PASSWORD in .env}
    volumes:
      - empleado-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamento-db:
    build:
      context: ./database/departamento
    environment:
      POSTGRES_DB: ${DEPARTAMENTO_DB_NAME:?Define DEPARTAMENTO_DB_NAME in .env}
      POSTGRES_USER: ${DEPARTAMENTO_DB_USER:?Define DEPARTAMENTO_DB_USER in .env}
      POSTGRES_PASSWORD: ${DEPARTAMENTO_DB_PASSWORD:?Define DEPARTAMENTO_DB_PASSWORD in .env}
    volumes:
      - departamento-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamento-service:
    build:
      context: ./departamento-service
    environment:
      PORT: ${DEPARTAMENTO_SERVICE_PORT:?Define DEPARTAMENTO_SERVICE_PORT in .env}
      DB_DEPARTAMENTO_HOST: ${DEPARTAMENTO_DB_HOST:?Define DEPARTAMENTO_DB_HOST in .env}
      DB_DEPARTAMENTO_PORT: ${DEPARTAMENTO_DB_PORT:?Define DEPARTAMENTO_DB_PORT in .env}
      DB_DEPARTAMENTO_NAME: ${DEPARTAMENTO_DB_NAME:?Define DEPARTAMENTO_DB_NAME in .env}
      DB_DEPARTAMENTO_USER: ${DEPARTAMENTO_DB_USER:?Define DEPARTAMENTO_DB_USER in .env}
      DB_DEPARTAMENTO_PASSWORD: ${DEPARTAMENTO_DB_PASSWORD:?Define DEPARTAMENTO_DB_PASSWORD in .env}
    expose:
      - "${DEPARTAMENTO_SERVICE_PORT:?Define DEPARTAMENTO_SERVICE_PORT in .env}"
    networks:
      - microservicios-network
    depends_on:
      departamento-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${DEPARTAMENTO_SERVICE_PORT}/health/ready', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  empleado-service:
    build:
      context: ./empleado-service
    image: empleado-service:${EMPLEADO_SERVICE_IMAGE_TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Define ASPNETCORE_ENVIRONMENT in .env}
      ASPNETCORE_URLS: http://+:${EMPLEADO_SERVICE_PORT:?Define EMPLEADO_SERVICE_PORT in .env}
      ConnectionStrings__EmpleadoService: Host=${EMPLEADO_DB_HOST:?Define EMPLEADO_DB_HOST in .env};Port=${EMPLEADO_DB_PORT:?Define EMPLEADO_DB_PORT in .env};Database=${EMPLEADO_DB_NAME:?Define EMPLEADO_DB_NAME in .env};Username=${EMPLEADO_DB_USER:?Define EMPLEADO_DB_USER in .env};Password=${EMPLEADO_DB_PASSWORD:?Define EMPLEADO_DB_PASSWORD in .env}
      Departamentos__BaseUrl: ${DEPARTAMENTO_SERVICE_URL:?Define DEPARTAMENTO_SERVICE_URL in .env}
      # Circuits breaker hacia Departamentos (reto: 3-5 fallos consecutivos, circuito abierto 30-60 s)
      Departamentos__Resilience__FallosConsecutivos: ${CB_FALLOS_CONSECUTIVOS:?Define CB_FALLOS_CONSECUTIVOS in .env}
      Departamentos__Resilience__TimeoutLlamada: ${CB_TIMEOUT_LLAMADA:?Define CB_TIMEOUT_LLAMADA in .env}
      Departamentos__Resilience__DuracionCircuitoAbierto: ${CB_DURACION_CIRCUITO_ABIERTO:?Define CB_DURACION_CIRCUITO_ABIERTO in .env}
      # RabbitMQ (Reto 4): sin esto, RabbitMqPublisher usa su default "localhost", que
      # dentro del contenedor de empleado-service apunta a si mismo, no al broker. Con
      # eso empleado.creado nunca sale y ningun consumidor (notificaciones-service) lo
      # recibe. Debe coincidir con las credenciales configuradas en message-broker abajo.
      RabbitMQ__Host: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RabbitMQ__Port: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RabbitMQ__Username: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
    expose:
      - "${EMPLEADO_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      empleado-db:
        condition: service_healthy
      departamento-service:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:${EMPLEADO_SERVICE_PORT}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gateway-service:
    build:
      context: ./gateway-service
    environment:
      GATEWAY_SERVICE_PORT: ${GATEWAY_SERVICE_PORT:?Define GATEWAY_SERVICE_PORT in .env}
      GATEWAY_CONNECT_TIMEOUT_MS: ${GATEWAY_CONNECT_TIMEOUT_MS:?Define GATEWAY_CONNECT_TIMEOUT_MS in .env}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:?Define GATEWAY_RESPONSE_TIMEOUT in .env}
      EMPLEADOS_SERVICE_URL: ${EMPLEADOS_SERVICE_URL:?Define EMPLEADOS_SERVICE_URL in .env}
      DEPARTAMENTO_SERVICE_URL: ${DEPARTAMENTO_SERVICE_URL:?Define DEPARTAMENTO_SERVICE_URL in .env}
      PERFILES_SERVICE_URL: ${PERFILES_SERVICE_URL:?Define PERFILES_SERVICE_URL in .env}
      NOTIFICACIONES_SERVICE_URL: ${NOTIFICACIONES_SERVICE_URL:?Define NOTIFICACIONES_SERVICE_URL in .env}
      VACACIONES_SERVICE_URL: ${VACACIONES_SERVICE_URL:?Define VACACIONES_SERVICE_URL in .env}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:?Define AUTH_SERVICE_URL in .env}
      JWT_SECRET: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY in .env}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${GATEWAY_SERVICE_PORT:?Define GATEWAY_SERVICE_PORT in .env}:${GATEWAY_SERVICE_PORT}"
    expose:
      - "${GATEWAY_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      empleado-service:
        condition: service_healthy
      departamento-service:
        condition: service_healthy
      perfiles-service:
        condition: service_healthy
      notificaciones-service:
        condition: service_healthy
      vacaciones-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:${GATEWAY_SERVICE_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  message-broker:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${RABBITMQ_AMQP_PORT:?Define RABBITMQ_AMQP_PORT in .env}:5672"
      - "${HOST_BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:?Define RABBITMQ_MANAGEMENT_PORT in .env}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  notificaciones-db:
    build:
      context: ./database/notificaciones
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_DB_NAME:?Define NOTIFICACIONES_DB_NAME in .env}
      POSTGRES_USER: ${NOTIFICACIONES_DB_USER:?Define NOTIFICACIONES_DB_USER in .env}
      POSTGRES_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:?Define NOTIFICACIONES_DB_PASSWORD in .env}
    volumes:
      - notificaciones-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  notificaciones-service:
    build:
      context: ./notificaciones-service
    environment:
      PORT: ${NOTIFICACIONES_SERVICE_PORT:?Define NOTIFICACIONES_SERVICE_PORT in .env}
      DB_HOST: ${NOTIFICACIONES_DB_HOST:?Define NOTIFICACIONES_DB_HOST in .env}
      DB_PORT: ${NOTIFICACIONES_DB_PORT:?Define NOTIFICACIONES_DB_PORT in .env}
      DB_NAME: ${NOTIFICACIONES_DB_NAME:?Define NOTIFICACIONES_DB_NAME in .env}
      DB_USER: ${NOTIFICACIONES_DB_USER:?Define NOTIFICACIONES_DB_USER in .env}
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:?Define NOTIFICACIONES_DB_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?Define RABBITMQ_EXCHANGE in .env}
      RABBITMQ_QUEUE: ${NOTIFICACIONES_RABBITMQ_QUEUE:?Define NOTIFICACIONES_RABBITMQ_QUEUE in .env}
      RABBITMQ_DLQ: ${NOTIFICACIONES_RABBITMQ_DLQ:?Define NOTIFICACIONES_RABBITMQ_DLQ in .env}
      RABBITMQ_AUTH_EXCHANGE: ${RABBITMQ_AUTH_EXCHANGE:?Define RABBITMQ_AUTH_EXCHANGE in .env}
      RABBITMQ_AUTH_QUEUE: ${NOTIFICACIONES_RABBITMQ_AUTH_QUEUE:?Define NOTIFICACIONES_RABBITMQ_AUTH_QUEUE in .env}
      RABBITMQ_AUTH_DLQ: ${NOTIFICACIONES_RABBITMQ_AUTH_DLQ:?Define NOTIFICACIONES_RABBITMQ_AUTH_DLQ in .env}
      RABBITMQ_RECONEXION_MS: ${RABBITMQ_RECONEXION_MS:?Define RABBITMQ_RECONEXION_MS in .env}
    expose:
      - "${NOTIFICACIONES_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      notificaciones-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${NOTIFICACIONES_SERVICE_PORT}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  perfiles-db:
    build:
      context: ./database/perfiles
    environment:
      POSTGRES_DB: ${PERFILES_DB_NAME:?Define PERFILES_DB_NAME in .env}
      POSTGRES_USER: ${PERFILES_DB_USER:?Define PERFILES_DB_USER in .env}
      POSTGRES_PASSWORD: ${PERFILES_DB_PASSWORD:?Define PERFILES_DB_PASSWORD in .env}
    volumes:
      - perfiles-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  perfiles-service:
    build:
      context: ./perfiles-service
    environment:
      PORT: ${PERFILES_SERVICE_PORT:?Define PERFILES_SERVICE_PORT in .env}
      DB_HOST: ${PERFILES_DB_HOST:?Define PERFILES_DB_HOST in .env}
      DB_PORT: ${PERFILES_DB_PORT:?Define PERFILES_DB_PORT in .env}
      DB_NAME: ${PERFILES_DB_NAME:?Define PERFILES_DB_NAME in .env}
      DB_USER: ${PERFILES_DB_USER:?Define PERFILES_DB_USER in .env}
      DB_PASSWORD: ${PERFILES_DB_PASSWORD:?Define PERFILES_DB_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?Define RABBITMQ_EXCHANGE in .env}
      RABBITMQ_QUEUE: ${PERFILES_RABBITMQ_QUEUE:?Define PERFILES_RABBITMQ_QUEUE in .env}
    expose:
      - "${PERFILES_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      perfiles-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${PERFILES_SERVICE_PORT}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  vacaciones-db:
    build:
      context: ./database/vacaciones
    environment:
      POSTGRES_DB: ${VACACIONES_DB_NAME:?Define VACACIONES_DB_NAME in .env}
      POSTGRES_USER: ${VACACIONES_DB_USER:?Define VACACIONES_DB_USER in .env}
      POSTGRES_PASSWORD: ${VACACIONES_DB_PASSWORD:?Define VACACIONES_DB_PASSWORD in .env}
    volumes:
      - vacaciones-data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  vacaciones-service:
    build:
      context: ./vacaciones-service
    environment:
      PORT: ${VACACIONES_SERVICE_PORT:?Define VACACIONES_SERVICE_PORT in .env}
      DB_HOST: ${VACACIONES_DB_HOST:?Define VACACIONES_DB_HOST in .env}
      DB_PORT: ${VACACIONES_DB_PORT:?Define VACACIONES_DB_PORT in .env}
      DB_NAME: ${VACACIONES_DB_NAME:?Define VACACIONES_DB_NAME in .env}
      DB_USER: ${VACACIONES_DB_USER:?Define VACACIONES_DB_USER in .env}
      DB_PASSWORD: ${VACACIONES_DB_PASSWORD:?Define VACACIONES_DB_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?Define RABBITMQ_EXCHANGE in .env}
      RABBITMQ_QUEUE: ${VACACIONES_RABBITMQ_QUEUE:?Define VACACIONES_RABBITMQ_QUEUE in .env}
      VACACIONES_CRON: ${VACACIONES_CRON:-0 * * * * *}
      VACACIONES_MANUAL_ENABLED: ${VACACIONES_MANUAL_ENABLED:-false}
    expose:
      - "${VACACIONES_SERVICE_PORT}"
    networks:
      - microservicios-network
    depends_on:
      vacaciones-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${VACACIONES_SERVICE_PORT}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped


  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:?Define AUTH_DB_NAME in .env}
      POSTGRES_USER: ${AUTH_DB_USER:?Define AUTH_DB_USER in .env}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD in .env}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: auth-service:${AUTH_SERVICE_IMAGE_TAG:-latest}
    container_name: auth-service
    expose:
      - "${AUTH_SERVICE_PORT:?Define AUTH_SERVICE_PORT in .env}"
    environment:
      SERVER_PORT: ${AUTH_SERVICE_PORT}
      DB_HOST: ${AUTH_DB_HOST:?Define AUTH_DB_HOST in .env}
      DB_PORT: ${AUTH_DB_PORT:?Define AUTH_DB_PORT in .env}
      DB_NAME: ${AUTH_DB_NAME:?Define AUTH_DB_NAME in .env}
      DB_USER: ${AUTH_DB_USER:?Define AUTH_DB_USER in .env}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD in .env}
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${AUTH_SERVICE_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PROMETHEUS_HOST_PORT:?Define PROMETHEUS_HOST_PORT in .env}:9090"
    volumes:
      - prometheus-data:/prometheus
    networks:
      - microservicios-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${GRAFANA_HOST_PORT:?Define GRAFANA_HOST_PORT in .env}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Define GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD in .env}
      PROMETHEUS_DATASOURCE_URL: ${PROMETHEUS_DATASOURCE_URL:?Define PROMETHEUS_DATASOURCE_URL in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - microservicios-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${LOKI_HOST_PORT:?Define LOKI_HOST_PORT in .env}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - microservicios-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?Define LOKI_PUSH_URL in .env}
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_started
    networks:
      - microservicios-network
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${ZIPKIN_HOST_PORT:?Define ZIPKIN_HOST_PORT in .env}:9411"
    networks:
      - microservicios-network
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:?Define SONAR_DB_NAME en .env}
      POSTGRES_USER: ${SONAR_DB_USER:?Define SONAR_DB_USER en .env}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Define SONAR_DB_PASSWORD en .env}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${SONARQUBE_HOST_PORT:?Define SONARQUBE_HOST_PORT in .env}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://${SONAR_DB_HOST:?Define SONAR_DB_HOST in .env}:${SONAR_DB_PORT:?Define SONAR_DB_PORT in .env}/${SONAR_DB_NAME:?Define SONAR_DB_NAME en .env}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:?Define SONAR_DB_USER en .env}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Define SONAR_DB_PASSWORD en .env}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - microservicios-network
    restart: unless-stopped

  dotnet-sonar-agent:
    image: dotnet-sonar:10.0-sonarscanner-10.8
    build:
      context: ./jenkins
      dockerfile: Dockerfile.dotnet-sonar
    profiles:
      - build-tools

  jenkins:
    profiles:
      - ci
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    # En Docker Desktop el socket suele usar el grupo 0; en Linux, define DOCKER_GID
    # con el gid real del socket (stat -c '%g' /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${JENKINS_HOST_PORT:?Define JENKINS_HOST_PORT in .env}:8080"
      - "${HOST_BIND_IP:-127.0.0.1}:${JENKINS_AGENT_PORT:?Define JENKINS_AGENT_PORT in .env}:50000" # Puerto para agentes de Jenkins
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_ROOT_URL: ${JENKINS_ROOT_URL:?define JENKINS_ROOT_URL en .env}
      JENKINS_SONARQUBE_URL: ${JENKINS_SONARQUBE_URL:?define JENKINS_SONARQUBE_URL en .env}
      GITHUB_REPOSITORY_URL: ${GITHUB_REPOSITORY_URL:?define GITHUB_REPOSITORY_URL en .env}
      JENKINS_ADMIN_USERNAME: ${JENKINS_ADMIN_USERNAME:?define JENKINS_ADMIN_USERNAME en .env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?define JENKINS_ADMIN_PASSWORD en .env}
      SONAR_TOKEN: ${SONAR_TOKEN:?Define SONAR_TOKEN en .env después de generarlo en SonarQube}
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Acceso al Docker daemon del host
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
      - ./.env:/run/secrets/microservicios.env:ro
    networks:
      - microservicios-network
    restart: unless-stopped

networks:
  microservicios-network:
    name: microservicios-network
    driver: bridge

volumes:
  rabbitmq-data:
  empleado-data:
  departamento-data:
  notificaciones-data:
  perfiles-data:
  vacaciones-data:
  auth_db_data:
  jenkins_data:
  sonar_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
