name: microservicios

services:
  empleado-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${EMPLEADO_DB_NAME:?Define EMPLEADO_DB_NAME in .env}
      POSTGRES_USER: ${EMPLEADO_DB_USER:?Define EMPLEADO_DB_USER in .env}
      POSTGRES_PASSWORD: ${EMPLEADO_DB_PASSWORD:?Define EMPLEADO_DB_PASSWORD in .env}
    volumes:
      - empleado-data:/var/lib/postgresql/data
      - ./database/empleado:/docker-entrypoint-initdb.d:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamento-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DEPARTAMENTO_DB_NAME:?Define DEPARTAMENTO_DB_NAME in .env}
      POSTGRES_USER: ${DEPARTAMENTO_DB_USER:?Define DEPARTAMENTO_DB_USER in .env}
      POSTGRES_PASSWORD: ${DEPARTAMENTO_DB_PASSWORD:?Define DEPARTAMENTO_DB_PASSWORD in .env}
    volumes:
      - departamento-data:/var/lib/postgresql/data
      - ./database/departamento:/docker-entrypoint-initdb.d:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamento-service:
    build:
      context: ./departamento-service
    environment:
      DB_DEPARTAMENTO_HOST: departamento-db
      DB_DEPARTAMENTO_PORT: 5432
      DB_DEPARTAMENTO_NAME: ${DEPARTAMENTO_DB_NAME:?Define DEPARTAMENTO_DB_NAME in .env}
      DB_DEPARTAMENTO_USER: ${DEPARTAMENTO_DB_USER:?Define DEPARTAMENTO_DB_USER in .env}
      DB_DEPARTAMENTO_PASSWORD: ${DEPARTAMENTO_DB_PASSWORD:?Define DEPARTAMENTO_DB_PASSWORD in .env}
    expose:
      - "${DEPARTAMENTO_SERVICE_PORT:?Define DEPARTAMENTO_SERVICE_PORT in .env}"
    networks:
      - microservicios-network
    depends_on:
      departamento-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/ready', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  empleado-service:
    build:
      context: ./empleado-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Define ASPNETCORE_ENVIRONMENT in .env}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EmpleadoService: Host=empleado-db;Port=5432;Database=${EMPLEADO_DB_NAME:?Define EMPLEADO_DB_NAME in .env};Username=${EMPLEADO_DB_USER:?Define EMPLEADO_DB_USER in .env};Password=${EMPLEADO_DB_PASSWORD:?Define EMPLEADO_DB_PASSWORD in .env}
      Departamentos__BaseUrl: http://departamento-service:8081/
      # Circuits breaker hacia Departamentos (reto: 3-5 fallos consecutivos, circuito abierto 30-60 s)
      Departamentos__Resilience__FallosConsecutivos: ${CB_FALLOS_CONSECUTIVOS:?Define CB_FALLOS_CONSECUTIVOS in .env}
      Departamentos__Resilience__TimeoutLlamada: ${CB_TIMEOUT_LLAMADA:?Define CB_TIMEOUT_LLAMADA in .env}
      Departamentos__Resilience__DuracionCircuitoAbierto: ${CB_DURACION_CIRCUITO_ABIERTO:?Define CB_DURACION_CIRCUITO_ABIERTO in .env}
      # RabbitMQ (Reto 4): sin esto, RabbitMqPublisher usa su default "localhost", que
      # dentro del contenedor de empleado-service apunta a si mismo, no al broker. Con
      # eso empleado.creado nunca sale y ningun consumidor (notificaciones-service) lo
      # recibe. Debe coincidir con las credenciales configuradas en message-broker abajo.
      RabbitMQ__Host: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RabbitMQ__Port: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RabbitMQ__Username: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
    expose:
      - "8080"
    networks:
      - microservicios-network
    depends_on:
      empleado-db:
        condition: service_healthy
      departamento-service:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gateway-service:
    build:
      context: ./gateway-service
    environment:
      GATEWAY_SERVER_PORT: ${GATEWAY_SERVER_PORT:?Define GATEWAY_SERVER_PORT in .env}
      GATEWAY_CONNECT_TIMEOUT_MS: ${GATEWAY_CONNECT_TIMEOUT_MS:?Define GATEWAY_CONNECT_TIMEOUT_MS in .env}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:?Define GATEWAY_RESPONSE_TIMEOUT in .env}
      EMPLEADOS_SERVICE_URL: ${EMPLEADOS_SERVICE_URL:?Define EMPLEADOS_SERVICE_URL in .env}
      DEPARTAMENTO_SERVICE_URL: ${DEPARTAMENTO_SERVICE_URL:?Define DEPARTAMENTO_SERVICE_URL in .env}
      PERFILES_SERVICE_URL: ${PERFILES_SERVICE_URL:?Define PERFILES_SERVICE_URL in .env}
      NOTIFICACIONES_SERVICE_URL: ${NOTIFICACIONES_SERVICE_URL:?Define NOTIFICACIONES_SERVICE_URL in .env}
      VACACIONES_SERVICE_URL: ${VACACIONES_SERVICE_URL:?Define VACACIONES_SERVICE_URL in .env}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:?Define AUTH_SERVICE_URL in .env}
      JWT_SECRET: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY in .env}
    ports:
      - "${GATEWAY_SERVICE_PORT:?Define GATEWAY_SERVICE_PORT in .env}:8088"
    networks:
      - microservicios-network
    depends_on:
      empleado-service:
        condition: service_healthy
      departamento-service:
        condition: service_healthy
      perfiles-service:
        condition: service_healthy
      notificaciones-service:
        condition: service_healthy
      vacaciones-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  message-broker:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "${RABBITMQ_AMQP_PORT:?Define RABBITMQ_AMQP_PORT in .env}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:?Define RABBITMQ_MANAGEMENT_PORT in .env}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  notificaciones-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_DB_NAME:?Define NOTIFICACIONES_DB_NAME in .env}
      POSTGRES_USER: ${NOTIFICACIONES_DB_USER:?Define NOTIFICACIONES_DB_USER in .env}
      POSTGRES_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:?Define NOTIFICACIONES_DB_PASSWORD in .env}
    volumes:
      - notificaciones-data:/var/lib/postgresql/data
      - ./database/notificaciones:/docker-entrypoint-initdb.d:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  notificaciones-service:
    build:
      context: ./notificaciones-service
    environment:
      PORT: 8082
      DB_HOST: notificaciones-db
      DB_PORT: 5432
      DB_NAME: ${NOTIFICACIONES_DB_NAME:?Define NOTIFICACIONES_DB_NAME in .env}
      DB_USER: ${NOTIFICACIONES_DB_USER:?Define NOTIFICACIONES_DB_USER in .env}
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:?Define NOTIFICACIONES_DB_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
    expose:
      - "8082"
    networks:
      - microservicios-network
    depends_on:
      notificaciones-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  perfiles-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PERFILES_DB_NAME:?Define PERFILES_DB_NAME in .env}
      POSTGRES_USER: ${PERFILES_DB_USER:?Define PERFILES_DB_USER in .env}
      POSTGRES_PASSWORD: ${PERFILES_DB_PASSWORD:?Define PERFILES_DB_PASSWORD in .env}
    volumes:
      - perfiles-data:/var/lib/postgresql/data
      - ./database/perfiles:/docker-entrypoint-initdb.d:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  perfiles-service:
    build:
      context: ./perfiles-service
    environment:
      PORT: 8083
      DB_HOST: perfiles-db
      DB_PORT: 5432
      DB_NAME: ${PERFILES_DB_NAME:?Define PERFILES_DB_NAME in .env}
      DB_USER: ${PERFILES_DB_USER:?Define PERFILES_DB_USER in .env}
      DB_PASSWORD: ${PERFILES_DB_PASSWORD:?Define PERFILES_DB_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      RABBITMQ_EXCHANGE: empleados_exchange
      RABBITMQ_QUEUE: perfiles.empleados
    expose:
      - "8083"
    networks:
      - microservicios-network
    depends_on:
      perfiles-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  vacaciones-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${VACACIONES_DB_NAME:?Define VACACIONES_DB_NAME in .env}
      POSTGRES_USER: ${VACACIONES_DB_USER:?Define VACACIONES_DB_USER in .env}
      POSTGRES_PASSWORD: ${VACACIONES_DB_PASSWORD:?Define VACACIONES_DB_PASSWORD in .env}
    volumes:
      - vacaciones-data:/var/lib/postgresql/data
      - ./database/vacaciones:/docker-entrypoint-initdb.d:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  vacaciones-service:
    build:
      context: ./vacaciones-service
    environment:
      PORT: ${VACACIONES_SERVICE_PORT:?Define VACACIONES_SERVICE_PORT in .env}
      DB_HOST: vacaciones-db
      DB_PORT: 5432
      DB_NAME: ${VACACIONES_DB_NAME:?Define VACACIONES_DB_NAME in .env}
      DB_USER: ${VACACIONES_DB_USER:?Define VACACIONES_DB_USER in .env}
      DB_PASSWORD: ${VACACIONES_DB_PASSWORD:?Define VACACIONES_DB_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Define RABBITMQ_HOST in .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?Define RABBITMQ_PORT in .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-empleados_exchange}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-vacaciones.empleados}
      VACACIONES_CRON: ${VACACIONES_CRON:-0 * * * * *}
      VACACIONES_MANUAL_ENABLED: ${VACACIONES_MANUAL_ENABLED:-false}
    expose:
      - "8085"
    networks:
      - microservicios-network
    depends_on:
      vacaciones-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped


  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:?Define AUTH_DB_NAME in .env}
      POSTGRES_USER: ${AUTH_DB_USER:?Define AUTH_DB_USER in .env}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD in .env}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    expose:
      - "8089"
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:?Define AUTH_DB_NAME in .env}
      DB_USER: ${AUTH_DB_USER:?Define AUTH_DB_USER in .env}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      auth-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
networks:
  microservicios-network:
    driver: bridge

volumes:
  empleado-data:
  departamento-data:
  notificaciones-data:
  perfiles-data:
  vacaciones-data:
  auth_db_data:
