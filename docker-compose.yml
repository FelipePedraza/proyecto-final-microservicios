name: reto-2-microservicios

services:
  registro-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${REGISTRO_DB_NAME:-registro_db}
      POSTGRES_USER: ${REGISTRO_DB_USER:-registro_user}
      POSTGRES_PASSWORD: ${REGISTRO_DB_PASSWORD:-registro_password}
    volumes:
      - registro-data:/var/lib/postgresql/data
      - ./database/registro:/docker-entrypoint-initdb.d:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamentos-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DEPARTAMENTOS_DB_NAME:-departamentos_db}
      POSTGRES_USER: ${DEPARTAMENTOS_DB_USER:-departamentos_user}
      POSTGRES_PASSWORD: ${DEPARTAMENTOS_DB_PASSWORD:-departamentos_password}
    volumes:
      - departamentos-data:/var/lib/postgresql/data
      - ./departamentos-serviceReto2/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  departamentos-service:
    build:
      context: ./departamentos-serviceReto2
    environment:
      DB_DEPARTAMENTOS_HOST: departamentos-db
      DB_DEPARTAMENTOS_PORT: 5432
      DB_DEPARTAMENTOS_NAME: ${DEPARTAMENTOS_DB_NAME:-departamentos_db}
      DB_DEPARTAMENTOS_USER: ${DEPARTAMENTOS_DB_USER:-departamentos_user}
      DB_DEPARTAMENTOS_PASSWORD: ${DEPARTAMENTOS_DB_PASSWORD:-departamentos_password}
    expose:
      - "${DEPARTAMENTOS_SERVICE_PORT:-8081}"
    networks:
      - microservicios-network
    depends_on:
      departamentos-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/ready', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  registro-service:
    build:
      context: ./Reto-1/RegistroService
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Registro: Host=registro-db;Port=5432;Database=${REGISTRO_DB_NAME:-registro_db};Username=${REGISTRO_DB_USER:-registro_user};Password=${REGISTRO_DB_PASSWORD:-registro_password}
      Departamentos__BaseUrl: http://departamentos-service:8081/
      # Circuits breaker hacia Departamentos (reto: 3-5 fallos consecutivos, circuito abierto 30-60 s)
      Departamentos__Resilience__FallosConsecutivos: ${CB_FALLOS_CONSECUTIVOS:-3}
      Departamentos__Resilience__TimeoutLlamada: ${CB_TIMEOUT_LLAMADA:-00:00:05}
      Departamentos__Resilience__DuracionCircuitoAbierto: ${CB_DURACION_CIRCUITO_ABIERTO:-00:00:30}
      # RabbitMQ (Reto 4): sin esto, RabbitMqPublisher usa su default "localhost", que
      # dentro del contenedor de registro-service apunta a si mismo, no al broker. Con
      # eso empleado.creado nunca sale y ningun consumidor (notificaciones-service) lo
      # recibe. Debe coincidir con RABBITMQ_DEFAULT_USER/PASS de message-broker abajo.
      RabbitMQ__Host: message-broker
      RabbitMQ__Port: 5672
      RabbitMQ__Username: admin
      RabbitMQ__Password: admin
    expose:
      - "${REGISTRO_SERVICE_PORT:-8080}"
    networks:
      - microservicios-network
    depends_on:
      registro-db:
        condition: service_healthy
      departamentos-service:
        condition: service_healthy
      # message-broker no define healthcheck en este compose, asi que solo se puede
      # esperar a que el contenedor arranque, no a que ya acepte conexiones. RabbitMqPublisher
      # solo intenta conectar una vez al arrancar (no reintenta), asi que esto reduce el
      # riesgo de una carrera de arranque, pero no lo elimina del todo.
      message-broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gateway-service:
    build:
      context: ./gateway-service
    environment:
      SERVER_PORT: 8088
      EMPLEADOS_SERVICE_URL: http://registro-service:8080
      DEPARTAMENTOS_SERVICE_URL: http://departamentos-service:8081
    ports:
      - "${GATEWAY_SERVICE_PORT:-8088}:8088"
    networks:
      - microservicios-network
    depends_on:
      registro-service:
        condition: service_healthy
      departamentos-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  message-broker:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - microservicios-network
    restart: unless-stopped

  notificaciones-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_DB_NAME:-notificaciones_db}
      POSTGRES_USER: ${NOTIFICACIONES_DB_USER:-notificaciones_user}
      POSTGRES_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones_password}
    volumes:
      - notificaciones-data:/var/lib/postgresql/data
      - ./notificaciones-service/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  notificaciones-service:
    build:
      context: ./notificaciones-service
    environment:
      PORT: 8082
      DB_HOST: notificaciones-db
      DB_PORT: 5432
      DB_NAME: ${NOTIFICACIONES_DB_NAME:-notificaciones_db}
      DB_USER: ${NOTIFICACIONES_DB_USER:-notificaciones_user}
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones_password}
      RABBITMQ_HOST: message-broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin
    ports:
      - "${NOTIFICACIONES_SERVICE_PORT:-8082}:8082"
    networks:
      - microservicios-network
    depends_on:
      notificaciones-db:
        condition: service_healthy
      # message-broker no define healthcheck en este compose, asi que no se puede pedir
      # "service_healthy" de el; se espera solo a que el contenedor arranque. Si RabbitMQ
      # todavia no acepta conexiones en ese momento, rabbitConsumer.js reintenta solo
      # (ver notificaciones-service/src/messaging/rabbitConsumer.js).
      message-broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  microservicios-network:
    driver: bridge

volumes:
  registro-data:
  departamentos-data:
  notificaciones-data:
